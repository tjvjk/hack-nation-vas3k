    const tools = qa('[class~="03-agent-loop-tool"]');

    tools.forEach((tool, index) => {
      const initialAngle = Number(tool.dataset.angle) * Math.PI / 180;
      const startX = Math.cos(initialAngle) * RADIUS_X;
      const startY = Math.sin(initialAngle) * RADIUS_Y;
      tl.fromTo(tool, { xPercent: -50, yPercent: -50, x: startX, y: startY, rotateX: 90, rotateY: -45, z: -180, opacity: 0, scale: .45 }, { xPercent: -50, yPercent: -50, x: startX, y: startY, rotateX: 0, rotateY: 0, z: 0, opacity: 1, scale: 1, duration: .52, ease: 'back.out(1.35)' }, ORBIT_START + index * .12);
      const orbit = { p: 0 };
      tl.to(orbit, { p: 1, duration: ORBIT_DURATION, ease: 'none', onUpdate: () => {
