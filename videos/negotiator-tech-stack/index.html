<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js" integrity="sha384-sG0Hv1tP1lZCk9KQmrIbY/XNwi+OY84GQqhMscbnsoBFqAz8KNCil1kvfL3Hbbk2" crossorigin="anonymous"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #000;
      }
      #root {
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #FFF8F0;
      }
      .scene {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="45"
      data-width="1920"
      data-height="1080"
    >
      <div
        id="el-01-intro"
        class="scene"
        data-composition-id="01-intro"
        data-composition-src="compositions/frames/01-intro.html"
        data-start="0"
        data-duration="6.5"
        data-track-index="0"
      ></div>

      <div
        id="el-02-compose"
        class="scene"
        data-composition-id="02-compose"
        data-composition-src="compositions/frames/02-compose.html"
        data-start="6"
        data-duration="8.6"
        data-track-index="1"
      ></div>

      <div
        id="el-03-agent-loop"
        class="scene"
        data-composition-id="03-agent-loop"
        data-composition-src="compositions/frames/03-agent-loop.html"
        data-start="14"
        data-duration="10.5"
        data-track-index="0"
      ></div>

      <div
        id="el-04-benchmark"
        class="scene"
        data-composition-id="04-benchmark"
        data-composition-src="compositions/frames/04-benchmark.html"
        data-start="24"
        data-duration="10.5"
        data-track-index="1"
      ></div>

      <div
        id="el-05-outcome"
        class="scene"
        data-composition-id="05-outcome"
        data-composition-src="compositions/frames/05-outcome.html"
        data-start="34"
        data-duration="11"
        data-track-index="0"
      ></div>

    </div>

    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
      // ── frame transitions (injected by transitions.mjs) ──
      (function () { var tl = window.__timelines["main"];
        tl.to("#el-01-intro", { opacity: 0, duration: 0.5, ease: "power2.inOut" }, 6);
        tl.fromTo("#el-02-compose", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.inOut" }, 6);
        tl.to("#el-02-compose", { filter: "blur(10px)", scale: 1.03, opacity: 0, duration: 0.6, ease: "power2.inOut" }, 14);
        tl.fromTo("#el-03-agent-loop", { filter: "blur(10px)", scale: 0.97, opacity: 0 }, { filter: "blur(0px)", scale: 1, opacity: 1, duration: 0.6, ease: "power2.inOut" }, 14);
        tl.to("#el-03-agent-loop", { opacity: 0, duration: 0.5, ease: "power2.inOut" }, 24);
        tl.fromTo("#el-04-benchmark", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.inOut" }, 24);
        tl.to("#el-04-benchmark", { opacity: 0, duration: 0.5, ease: "power2.inOut" }, 34);
        tl.fromTo("#el-05-outcome", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.inOut" }, 34);
        tl.to({}, { duration: 45 }, 0); // full-span anchor — main.duration() == composition total (Studio master duration)
      })();
    </script>
  </body>
</html>
